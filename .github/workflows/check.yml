name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: school_checkin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/school_checkin_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.0'
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra demo --locked --python 3.12
      - run: uv run --extra dev --extra demo pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/static/app.js
      - run: node --check app/static/coverage.js
